y:flex;gap:8px;justify-self:end}button{background:#154253;border:1px solid #367787;color:white;border-radius:13px;padding:11px 16px;font-weight:700;min-height:43px}button:hover{background:#216070}button:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}.counter{color:#a6c9cb;font-size:.84rem;min-width:82px;text-align:center}.progress{height:4px;background:#133745;margin-top:17px;border-radius:6px;overflow:hidden}.bar{height:100%;background:#2bd5b8;transition:width .26s ease}.notes{font-size:.75rem;color:#86afb9}.summary-list{display:grid;gap:12px}.summary-item{display:flex;gap:12px;align-items:center;color:#c3dede}.summary-item b{color:var(--aqua);font-size:1.25rem}.mobile-hint{display:none}@media(max-width:830px){.shell{padding:17px 19px}.main{grid-template-columns:1fr;gap:14px;padding:34px 0}.aside{min-height:220px;padding:24px}.aside h2{font-size:1.7rem}.bottom{grid-template-columns:1fr auto;gap:12px}.notes{display:none}.controls{justify-self:end}.mobile-hint{display:block;font-size:.72rem;color:var(--muted)}h1{font-size:clamp(2.7rem,11vw,4.5rem)}}@media(prefers-reduced-motion:reduce){.bar{transition:none}}</style></head><body>
<div class="shell"><div class="top"><div><div class="logo">NEXUS<span style="color:#55dfc6">.</span></div><a class="back" href="../">← Voltar ao site institucional</a></div><div class="minitag">Apresentação institucional · TCC 2026<br>Proposta de administradora condominial</div></div><main class="main"><article class="copy" aria-live="polite"><div id="sLabel" class="eyebrow"></div><h1 id="sTitle"></h1><p id="sText"></p></article><aside class="aside"><small id="sMark">NEXUS / MODELO DE NEGÓCIO</small><h2 id="sAside"></h2><div id="sChips" class="chips"></div></aside></main><div class="bottom"><span class="notes">Teclas ← → para navegar · F para tela cheia</span><div class="counter" id="counter">01 / 13</div><div class="controls"><button type="button" id="prev" aria-label="Voltar slide">←</button><button type="button" id="full" aria-label="Tela cheia">⛶</button><button type="button" id="next" aria-label="Próximo slide">Avançar →</button></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="mobile-hint" style="padding-top:10px">Use os botões para navegar pelos 13 quadros.</div></div>
<script>
const slides=[
 ['NEXUS / APRESENTAÇÃO','Gestão condominial. Uma visão integrada.','Proposta acadêmica de administradora de condomínios que reúne pessoas, processos e tecnologia.','CONHEÇA A NEXUS',['TCC 2026','São Paulo','Projeto acadêmico']],
 ['O PROBLEMA','Uma rotina complexa exige organização.','Síndicos e conselhos lidam com cobranças, documentos, fornecedores, manutenção, comunicação e decisões.','DESAFIOS DA GESTÃO',['Finanças','Documentos','Pessoas']],
 ['01 / PROPOSTA DE VALOR','Mais clareza. Mais acompanhamento.','A proposta da Nexus é reunir informações, atendimento consultivo e tecnologia para apoiar a gestão e facilitar a comunicação.','NOSSA PROMESSA',['Organização','Transparência','Acompanhamento']],
 ['02 / CLIENTES','Pensada para condomínios exigentes.','O estudo contempla condomínios residenciais de maior porte, administrados por síndicos profissionais, e empreendimentos corporativos.','PÚBLICO-ALVO',['Residenciais','Síndicos','Corporativos']],
 ['03 / CANAIS','Presença onde começa a confiança.','Site institucional, busca, LinkedIn, contato comercial, indicações e eventos são os canais previstos para apresentar o negócio.','CONEXÕES',['Site','LinkedIn','Indicações']],
 ['04 / RELACIONAMENTO','Tecnologia e atendimento humano.','O modelo prevê implantação assistida, atendimento híbrido, registros de solicitações e prestação de contas periódica.','EXPERIÊNCIA',['Atendimento híbrido','Registros','Rotina']],
 ['05 / ATIVIDADES','Rotina acompanhada de ponta a ponta.','Organização financeira e documental, atendimento, coordenação de fornecedores e relatórios administrativos formam o trabalho central.','OPERAÇÃO',['Finanças','Documentos','Fornecedores']],
 ['06 / RECURSOS','Pessoas, estrutura e ferramentas.','A estrutura planejada combina cinco funções de equipe, escritório de referência em São Paulo e tecnologia contratada externamente.','CAPACIDADE',['Equipe','Escritório','Plataforma']],
 ['07 / PARCEIROS','Rede de execução especializada.','Empresas externas poderão atender necessidades de manutenção, segurança, conservação, paisagismo e conveniência, mediante seleção e aprovação.','REDE PROJETADA',['Homologação','Qualidade','Autorização']],
 ['08 / RECEITAS','Um modelo de remuneração planejado.','Honorários administrativos e serviços extraordinários contratados separadamente. As receitas de conveniência são possibilidades, não garantias.','MODELO COMERCIAL',['Honorários','Extras','Conveniências']],
 ['09 / CUSTOS','Sustentabilidade vem do planejamento.','Equipe, imóvel, tecnologia e capital de giro são elementos centrais. A viabilidade depende da conquista de clientes e do controle das despesas.','DISCIPLINA FINANCEIRA',['Pessoal','Tecnologia','Capital de giro']],
 ['IMPLANTAÇÃO','Da ideia à operação: etapas de validação.','O plano ainda precisaria validar contratos, preços, tecnologia, conformidade e segurança financeira antes de qualquer lançamento efetivo.','RESPONSABILIDADE',['Cotações','Testes','Contratos']],
 ['CONCLUSÃO','Nexus. Gestão com mais clareza.','Uma proposta acadêmica de integração condominial, construída para demonstrar visão de negócio, processos e disciplina de planejamento.','OBRIGADO',['TCC 2026','Nove segmentos','Nexus']]
];let i=0;const $=id=>document.getElementById(id);function render(){const [l,t,p,a,tags]=slides[i];$('sLabel').textContent=l;$('sTitle').textContent=t;$('sText').textContent=p;$('sAside').textContent=a;$('sChips').replaceChildren(...tags.map(v=>{let e=document.createElement('span');e.className='chip';e.textContent=v;return e}));$('counter').textContent=`${String(i+1).padStart(2,'0')} / ${slides.length}`;$('bar').style.width=((i+1)/slides.length*100)+'%'}
function move(n){i=Math.max(0,Math.min(slides.length-1,i+n));render()}$('next').addEventListener('click',()=>move(1));$('prev').addEventListener('click',()=>move(-1));$('full').addEventListener('click',()=>document.documentElement.requestFullscreen?.());document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key.toLowerCase()==='f'&&e.target.tagName!=='INPUT')document.documentElement.requestFullscreen?.()});render();
